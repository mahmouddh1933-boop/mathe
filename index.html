function factorial(n) {let p=1;for(let i=2;i<=n;i++)p*=i;return p;}
function choose(n,k) {return Math.round(factorial(n)/factorial(k)/factorial(n-k));}

function startSession(ids=null,options={}){

 data.mistakes=data.mistakes.slice(-100);save();}
function next(){if(!session?.checked)return;if(++session.index>=session.questions.length){view='result';result();}else{session.checked=false;session.answer=null;session.feedback=null;exercise();}focusMain();}
function result(){const s=session;const percent=Math.round(s.correct/s.questions.length*100);shell(`<section class="result-hero"><span class="result-spark">✦</span><span class="eyebrow">DEINE RUNDE IST GESCHAFFT</span><h1>${percent>=80?'Das kann sich sehen lassen!':percent>=50?'Du bist auf einem guten Weg.':'Jede Übung ist ein neuer Anfang.'}</h1><p>${s.correct} von ${s.questions.length} Aufgaben richtig · ${s.results.filter(x=>x.skipped).length} übersprungen</p><div class="result-score">${percent}<small>%</small></div><p>Du hast dir Zeit fürs Lernen genommen. Darauf kommt es an.</p><div class="result-actions"><button class="btn primary" data-action="again">Noch eine Runde →</button><button class="btn outline" data-nav="repeat">Fehler wiederholen ↻</button><button class="text-btn" data-nav="home">Zur Übersicht</button></div></section><section class="panel"><h2>Deine Aufgaben im Rückblick</h2><div class="result-list">${s.results.map((r,i)=>`<details><summary><span class="result-dot ${r.correct?'is-correct':''}">${r.correct?'✓':r.skipped?'−':'↻'}</span><span>${i+1}. ${escape(r.q.prompt)}</span><b>${r.correct?'Richtig':r.skipped?'Übersprungen':'Wiederholen'}</b></summary><div class="result-detail"><p>Deine Antwort: ${escape(r.skipped?'Übersprungen':Array.isArray(r.answer)?r.answer.map(format).join(' · '):format(r.answer))}</p><p><strong>Lösung: ${escape(solution(r.q))}</strong></p><p>${escape(r.q.explanation)}</p></div></details>`).join('')}</div></section>`);}
function repeat(){const ms=data.mistakes.filter(m=>m.q.grade===grade);shell(`${heading(`KLASSE ${grade} · DEIN TRAINING`,'Aus Fehlern werden Aha-Momente.','Hier warten Aufgaben, die noch nicht geklappt haben. Eine richtige Wiederholung entfernt die jeweilige Aufgabe.')}<section class="panel repeat-panel"><div class="repeat-symbol">↻</div><h2>${ms.length?`${ms.length} Aufgaben für deinen nächsten Schritt`:'Hier hast du einen frischen Start.'}</h2><p>${ms.length?'Du übst genau die Aufgaben noch einmal, bei denen du Unterstützung gebraucht hast.':'Sobald du eine Aufgabe falsch beantwortest oder überspringst, findest du sie hier wieder.'}</p>${ms.length?'<button class="btn primary" data-action="repeat">Bis zu 10 Aufgaben wiederholen →</button>':'<button class="btn primary" data-nav="topics">Ein Thema entdecken →</button>'}${data.mistakes.length>ms.length?`<p class="muted">${data.mistakes.length-ms.length} weitere Aufgaben liegen in anderen Klassenstufen.</p>`:''}</section>${ms.length?`<div class="repeat-topics">${[...new Set(ms.map(m=>m.q.topicTitle))].map(t=>`<span class="class-pill">${escape(t)}</span>`).join('')}</div>`:''}`);}
function startRepeat(){const ms=shuffle(data.mistakes.filter(m=>m.q.grade===grade)).slice(0,10);if(!ms.length)return;session={grade,questions:ms.map(m=>m.q),index:0,correct:0,results:[],checked:false,answer:null,feedback:null,label:'Gezielt wiederholen',repetition:true};view='exercise';exercise();focusMain();}
function progress(){const ts=curriculum[grade];shell(`${heading('DEIN FORTSCHRITT','Jeder Schritt zählt.','Deine Antworten werden lokal in diesem Browser gespeichert. Es gibt keine Übertragung und keine Noten.')}<section class="stats-grid"><div class="stat"><span class="stat-icon peach">✓</span><div><strong>${data.attempts}</strong><span>Versuche · alle Klassen</span></div></div><div class="stat"><span class="stat-icon sage">→</span><div><strong>${pct(data)}<small>%</small></strong><span>Richtige Antworten · alle Klassen</span></div></div><div class="stat"><span class="stat-icon lavender">◷</span><div><strong>${data.days.length}</strong><span>Tage mit mindestens einer Aufgabe</span></div></div></section><section class="panel"><div class="section-heading"><h2>Deine Themen · Klasse ${grade}</h2><span class="muted">Ziel: je 10 richtige Antworten</span></div><div class="progress-list">${ts.map(t=>{const s=stats(grade,t.id);return `<button class="progress-row" data-topic="${t.id}"><div><strong>${escape(t.title)}</strong><span>${s.attempts} versucht · ${s.correct} richtig${s.attempts?' · '+pct(s)+' %':''}</span></div><div class="progress-track"><i style="width:${Math.min(100,s.correct*10)}%"></i></div><b>${Math.min(s.correct,10)}/10</b><span>→</span></button>`;}).join('')}</div></section><section class="panel data-panel"><div><h2>Deine Daten bleiben bei dir.</h2><p>Beim Löschen der Browserdaten geht der Fortschritt verloren. Du kannst deine Lerndaten als JSON-Datei dokumentieren. Ein Wiederimport ist derzeit nicht vorgesehen.</p></div><button class="btn outline" data-action="export">Fortschritt exportieren ↓</button><button class="text-btn danger" data-action="reset">Fortschritt zurücksetzen</button></section>`);}
function flashcards(id){const ts=id?curriculum[grade].filter(t=>t.id===id):curriculum[grade];cards={topics:ts,index:0,revealed:false};view='cards';renderCards();}
function renderCards(){const t=cards.topics[cards.index];shell(`${heading(`KLASSE ${grade} · MERKKARTEN`,'Ein Gedanke zum Mitnehmen.','Erinnere dich zuerst selbst an die Regel und decke dann die Erklärung auf.')}<section class="panel flashcard"><span class="eyebrow">${cards.index+1} / ${cards.topics.length} · ${t.group}</span><h2>${escape(t.title)}</h2><p>${cards.revealed?escape(t.rule):'Welche Regel hilft dir bei diesem Thema?'}</p>${cards.revealed?`<button class="btn primary" data-start="${t.id}">Jetzt anwenden →</button>`:'<button class="btn primary" data-action="reveal">Erklärung aufdecken</button>'}<button class="text-btn" data-action="card-next">Nächste Karte →</button></section>`);}
function syncMenu(){const sidebar=document.querySelector('.sidebar');if(sidebar)sidebar.inert=matchMedia('(max-width:760px)').matches&&!showMobile;document.querySelector('.mobile-menu')?.setAttribute('aria-expanded',String(showMobile));}
matchMedia('(max-width:760px)').addEventListener('change',syncMenu);
function focusMain(){document.querySelector('#main')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
function navigate(v){view=v;showMobile=false;search='';group='Alle';({home,topics,quiz,repeat,progress}[v]||home)();focusMain();}
app.addEventListener('click',e=>{const b=e.target.closest('button,a[data-action]');if(!b)return;
 if(b.dataset.nav){navigate(b.dataset.nav);return;}if(b.dataset.topic){view='topics';openTopic(b.dataset.topic);focusMain();return;}
 if(b.dataset.start){startSession([b.dataset.start]);return;}if(b.dataset.cards){flashcards(b.dataset.cards);return;}
 if(b.dataset.group){group=b.dataset.group;topics();return;}
 switch(b.dataset.action){case 'home':e.preventDefault();navigate('home');break;case 'menu':showMobile=!showMobile;document.querySelector('.sidebar').classList.toggle('open',showMobile);syncMenu();break;case 'next':next();break;case 'skip':checkAnswer(true);break;case 'exit':if(session?.results.length){session.questions=session.questions.slice(0,session.results.length);view='result';result();focusMain();}else navigate('topics');break;case 'again':if(session.repetition){if(data.mistakes.some(m=>m.q.grade===grade))startRepeat();else navigate('repeat');}else startSession(session.label==='Wissensquiz'?null:[session.questions[0].topicId]);break;case 'repeat':startRepeat();break;case 'reveal':cards.revealed=true;renderCards();break;case 'card-next':cards.index=(cards.index+1)%cards.topics.length;cards.revealed=false;renderCards();break;case 'export':{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`mathe-fortschritt-${day()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break;}case 'reset':showReset();break;case 'cancel-reset':document.querySelector('dialog').close();document.querySelector('dialog').remove();break;case 'confirm-reset':data=empty();data.grade=grade;save();progress();break;}
});
function showReset(){const d=document.createElement('dialog');d.innerHTML='<h2>Fortschritt zurücksetzen?</h2><p>Alle Antworten, Übungsziele und Wiederholungsaufgaben auf diesem Gerät werden gelöscht. Exportiere vorher deine Lerndaten, wenn du sie dokumentieren möchtest.</p><div class="result-actions"><button class="btn outline" data-action="cancel-reset">Abbrechen</button><button class="btn primary" data-action="confirm-reset">Jetzt zurücksetzen</button></div>';app.append(d);d.addEventListener('cancel',()=>d.remove());d.showModal();}
app.addEventListener('submit',e=>{if(e.target.id==='quiz-form'){e.preventDefault();const f=new FormData(e.target);startSession(null,{length:Number(f.get('length')),format:f.get('format'),difficulty:f.get('difficulty')});}if(e.target.id==='answer-form'){e.preventDefault();checkAnswer();}});
app.addEventListener('change',e=>{if(e.target.id==='grade-select'){grade=Number(e.target.value);data.grade=grade;save();navigate(['exercise','result','cards'].includes(view)?'home':view);}});
app.addEventListener('input',e=>{if(e.target.id==='topic-search'){search=e.target.value;document.querySelector('#topic-results').innerHTML=filteredTopics();}});
home();

})();</script>
</body>
</html>
