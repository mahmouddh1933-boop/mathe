function learningRecord(id=lessonId){return data.learning[topicKey(grade,id)]||{read:false,passed:[0,0,0,0],attempts:0,correct:0};}
function putLearning(record){data.learning[topicKey(grade,lessonId)]=record;save();}
function stageTarget(){return 3;}
function completedStages(id){return learningRecord(id).passed.filter(n=>n>=stageTarget(id)).length;}
function unlockedStage(id){const p=learningRecord(id).passed;const first=p.findIndex(n=>n<stageTarget(id));return first<0?3:first;}
function topicCard(t,i){const s=learningRecord(t.id),done=completedStages(t.id);return `<button class="topic-card" data-topic="${t.id}" style="--card-accent:${['#7865e9','#e49c61','#68a99a','#db83a5'][i%4]}"><div class="topic-card-top"><span class="topic-symbol">${({Rechnen:'＋',Zahlen:'123',Geometrie:'△',Brüche:'½',Algebra:'x²',Funktionen:'ƒ',Analysis:'∫',Stochastik:'P'})[t.group]||'✦'}</span><span class="topic-group">${escape(t.group)}</span></div><h3>${escape(t.title)}</h3><p>${escape(t.description)}</p><div class="mini-stages" aria-label="${done} von 4 Stufen geschafft">${learningStages.map((_,j)=>`<i class="${s.passed[j]>=stageTarget(t.id)?'done':''}"></i>`).join('')}</div><div class="topic-card-bottom"><span>${done===4?'Alle Stufen geschafft':s.read?`${done}/4 Stufen · Weiterlernen`:'Erklärung + 3 Beispiele + Training'}</span><span class="round-arrow">→</span></div></button>`;}
function home(){const ts=curriculum[grade],next=ts.find(t=>completedStages(t.id)<4)||ts[0],done=ts.filter(t=>completedStages(t.id)===4).length,started=ts.filter(t=>learningRecord(t.id).read).length;shell(`<div class="studio-heading"><div><span class="eyebrow">DEIN MATHE-LERNSTUDIO · KLASSE ${grade}</span><h1>Verstehen. Ausprobieren.<br><em>Selber können.</em><span class="heading-spark">✦</span></h1><p>Aus einem großen „Wie?“ werden viele kleine „Aha!“.</p></div><span class="class-pill">${gradeLabel(grade)}</span></div><section class="studio-hero"><div><span class="hero-label">DEIN WEG ZUM AHA-MOMENT</span><h2>Du musst nicht alles<br>auf einmal können.</h2><p>Entdecke die Erklärung, geh Beispiele Schritt für Schritt durch und übernimm nach und nach selbst das Steuer.</p><button class="btn light" data-topic="${next.id}">${started?'Meinen Lernweg fortsetzen':'Meinen ersten Kurs entdecken'} <span>→</span></button><div class="hero-trust"><span>✓ Ohne Zeitdruck</span><span>✓ Mit echten Rechenwegen</span></div></div><div class="journey-art" aria-hidden="true"><div class="floating-formula">x² + 2x + 1</div><div class="art-step step-a"><b>01</b><span>Erst verstehen</span><i>✦</i></div><div class="art-step step-b"><b>02</b><span>Gemeinsam üben</span><i>□</i></div><div class="art-step step-c"><b>03</b><span>Selbst lösen</span><i>✓</i></div><span class="art-orb"></span></div></section><div class="learning-roadmap"><div><b>01</b><span>Farbig erklärt<small>Mit 3 Beispielen</small></span></div><span>→</span><div><b>02</b><span>Eine Lücke<small>Ein kleiner Schritt</small></span></div><span>→</span><div><b>03</b><span>Mehr übernehmen<small>Weniger Vorgaben</small></span></div><span>→</span><div><b>04</b><span>Ganz selbst lösen<small>Dein eigener Weg</small></span></div></div><div class="section-heading"><div><span class="eyebrow">NEUGIER IST DEIN BESTER START</span><h2>Was möchtest du verstehen?</h2></div><button class="text-btn" data-nav="topics">Alle ${ts.length} Kurse →</button></div><div class="topic-grid">${ts.slice(0,6).map(topicCard).join('')}</div><div class="studio-bottom"><div><span class="eyebrow">DEIN FORTSCHRITT · KLASSE ${grade}</span><h2>${done} Kurse geschafft. ${started} angefangen.</h2><p>Jeder gefüllte Abschnitt zeigt, was du schon selbst lösen kannst. Kleine Schritte sind auch Fortschritte.</p></div><button class="btn outline" data-nav="progress">Meinen Lernweg ansehen →</button></div>`);}
function openTopic(id){const t=curriculum[grade].find(t=>t.id===id);if(!t)return;lessonId=id;exampleIndex=0;view='lesson';renderLesson();updateLab();}
function currentTopic(){return curriculum[grade].find(t=>t.id===lessonId);}
function deterministicExample(index){let seed=grade*137+lessonId.split('').reduce((a,c)=>a+c.charCodeAt(0),0);const rng=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};const seen=new Set();let task;for(let j=0;j<=index;j++){for(let tries=0;tries<30;tries++){task=workedTask(grade,currentTopic(),{rng,easy:j===0});if(!seen.has(task.signature))break;}seen.add(task.signature);}return task;}
function lessonRail(){const p=learningRecord(),target=stageTarget(),unlocked=unlockedStage(lessonId);return `<aside class="lesson-rail"><div class="rail-top"><span class="eyebrow">DEIN LERNPFAD</span><strong>Ein Schritt nach dem anderen.</strong></div><button class="rail-item active" data-learning-action="explanation"><span>✦</span><div><b>Verstehen</b><small>Erklärung & Beispiele</small></div></button>${learningStages.map((s,i)=>`<button class="rail-item ${p.passed[i]>=target?'finished':''}" data-stage="${i}" ${!p.read||i>unlocked?'disabled':''}><span>${p.passed[i]>=target?'✓':i+1}</span><div><b>${s.short}</b><small>${i>unlocked?'Nach der vorherigen Stufe':`${Math.min(p.passed[i],target)}/${target} Aufgaben geschafft`}</small></div>${i>unlocked?'<small>🔒</small>':''}</button>`).join('')}<p>Die nächste Stufe öffnet sich nach ${target} richtig gelösten Aufgaben. Aufgedeckte Lösungen zählen nicht mit.</p></aside>`;}
function renderLesson(){const t=currentTopic(),g=lessonGuides[t.id],p=learningRecord(),ex=deterministicExample(exampleIndex);shell(`<div class="lesson-breadcrumb"><button class="text-btn" data-nav="topics">← Alle Lernkurse</button><span>Klasse ${grade} / ${escape(t.group)}</span></div><div class="lesson-heading"><span class="eyebrow">DEIN AHA-KURS</span><h1>${escape(t.title)}</h1><p>${escape(t.description)} In deinem Tempo, mit einem klaren Weg.</p></div><div class="course-layout"><div class="lesson-content"><section class="explanation-card idea-card"><div class="card-kicker"><span>01</span> DIE IDEE DAHINTER</div><h2>Was steckt dahinter?</h2><p>${escape(g.idea)}</p><div class="rule-box"><span>MERKE DIR</span><p>${escape(t.rule)}</p></div></section><section class="explanation-card method-card"><div class="card-kicker"><span>02</span> DEIN WERKZEUG</div><h2>So gehst du vor.</h2><p>${escape(g.method)}</p><div class="pitfall"><b>↳ Typischer Stolperstein</b><p>${escape(g.pitfall)}</p></div></section>${renderLab(t)}<section class="worked-example"><div class="section-heading"><div><span class="eyebrow">03 · SCHAU GENAU HIN</span><h2>Drei Beispiele. Jeder Schritt erklärt.</h2></div></div><div class="example-tabs" role="tablist" aria-label="Rechenbeispiele">${[0,1,2].map(i=>`<button role="tab" aria-selected="${i===exampleIndex}" data-example="${i}" class="${i===exampleIndex?'selected':''}">Beispiel ${i+1}${i===0?' · Einstieg':''}</button>`).join('')}</div><div class="example-body" role="tabpanel"><h3>${escape(ex.prompt)}</h3>${renderTaskVisual(ex.visual)}${workedStepsHTML(ex)}<div class="example-bottom"><span>✓ Frage dich: Warum ist jeder Schritt erlaubt?</span><button class="text-btn" data-example="${(exampleIndex+1)%3}">Nächstes Beispiel →</button></div></div></section><section class="ready-card"><div><span class="eyebrow">JETZT BIST DU DRAN</span><h2>${p.read?'Bereit für deinen nächsten Schritt?':'Vom Zuschauen zum Selbermachen.'}</h2><p>Du startest leicht. Danach verschwinden die Hilfen nach und nach.</p></div><button class="btn primary" data-learning-action="begin">${p.read?'Training fortsetzen':'Verstanden · Einfach starten'} →</button></section></div>${lessonRail()}</div>`);}
function workedStepsHTML(task){return `<ol class="worked-steps">${task.steps.map((s,i)=>`<li style="--step-color:${['#7160d7','#247a8c','#b46b26'][i%3]}"><span class="step-number">${i+1}</span><div><strong>${escape(s.label)}</strong><div class="step-equation">${escape(s.before)}<mark>${escape(format(s.value))}</mark>${escape(s.after)}</div><p>${escape(s.why)}</p></div></li>`).join('')}</ol>`;}
function renderTaskVisual(v){if(!v)return '';let svg='';if(v.kind==='fraction')svg=Array.from({length:v.den},(_,i)=>`<rect x="${12+i*280/v.den}" y="25" width="${280/v.den-3}" height="45" rx="5" fill="${i<v.num?'#8373df':'#e9e5f8'}"/>`).join('');if(v.kind==='rectangle')svg=`<rect x="60" y="18" width="180" height="70" rx="7" fill="#eee9ff" stroke="#8271d4" stroke-width="2"/><text x="150" y="12" text-anchor="middle">${v.a} m</text><text x="250" y="58">${v.b} m</text>`;if(v.kind==='shape')svg=v.name==='Kreis'?'<circle cx="150" cy="60" r="45" fill="#eee9ff" stroke="#8271d4" stroke-width="3"/>':v.name==='Fünfeck'?'<polygon points="150,8 195,40 177,94 123,94 105,40" fill="#eee9ff" stroke="#8271d4" stroke-width="3"/>':v.name==='Rechteck'?'<rect x="90" y="25" width="120" height="60" rx="3" fill="#eee9ff" stroke="#8271d4" stroke-width="3"/>':v.square?'<rect x="110" y="15" width="75" height="75" rx="3" fill="#eee9ff" stroke="#8271d4" stroke-width="3"/>':'<polygon points="150,10 95,90 205,90" fill="#eee9ff" stroke="#8271d4" stroke-width="3"/>';if(v.kind==='bars')svg=v.vals.map((n,i)=>`<rect x="${50+i*80}" y="${85-n*7}" width="40" height="${n*7}" rx="5" fill="${['#8271d4','#64a998','#d9a36b'][i]}"/><text x="${70+i*80}" y="${78-n*7}" text-anchor="middle">${n}</text><text x="${70+i*80}" y="102" text-anchor="middle">${'ABC'[i]}</text>`).join('');if(v.kind==='line'||v.kind==='parabola'){const pts=Array.from({length:81},(_,i)=>{const x=-4+i/10,y=v.kind==='line'?v.m*x+v.b:v.a*(x-v.d)**2+v.e;return `${150+x*28},${62-y*5}`;}).join(' ');svg=`<path d="M10 62H290M150 5V112" stroke="#c8c1d8" fill="none"/><polyline points="${pts}" fill="none" stroke="#7865d9" stroke-width="2.5"/><text x="280" y="77">x</text><text x="155" y="12">y</text>`;}if(v.kind==='clock'){const min=v.m/60*2*Math.PI,hour=(v.h+v.m/60)/12*2*Math.PI;svg=`<circle cx="150" cy="60" r="48" fill="#fff" stroke="#8271d4" stroke-width="2"/>${Array.from({length:12},(_,i)=>`<text text-anchor="middle" dominant-baseline="middle" x="${150+39*Math.sin((i+1)/12*2*Math.PI)}" y="${60-39*Math.cos((i+1)/12*2*Math.PI)}">${i+1}</text>`).join('')}<path d="M${150+30*Math.sin(min)} ${60-30*Math.cos(min)}L150 60L${150+22*Math.sin(hour)} ${60-22*Math.cos(hour)}" stroke="#514682" stroke-width="3" fill="none"/>`;}
return svg?`<div class="lesson-visual"><svg viewBox="0 0 310 120" role="img" aria-label="Veranschaulichung der oben beschriebenen Aufgabe">${svg}</svg></div>`:'';}
function renderLab(t){if(!['linear','slope','parabola','fraction','percent','area','perimeter','multiply','add','numberLine'].includes(t.id))return '';const mode=['linear','slope','parabola'].includes(t.id)?'function':['fraction','percent'].includes(t.id)?'part':['area','perimeter'].includes(t.id)?'rectangle':'arithmetic';return `<section class="discovery-lab" data-lab-mode="${mode}" data-lab-topic="${t.id}"><span class="eyebrow">ANFASSEN STATT NUR ANSCHAUEN</span><h2>Dein Entdecker-Labor</h2><p>Bewege die Regler und beobachte, was sich verändert.</p><div class="lab-controls"><label>${mode==='function'?(t.id==='parabola'?'Verschiebung d':'Steigung m'):mode==='part'?'Anteil in Prozent':mode==='rectangle'?'Länge a':'Erste Zahl'}<input data-lab="a" type="range" min="${mode==='function'?-3:mode==='part'?0:1}" max="${mode==='part'?100:mode==='function'?3:10}" value="${mode==='part'?25:2}"></label><label>${mode==='function'?(t.id==='parabola'?'Verschiebung e':'y-Achsenabschnitt b'):mode==='part'?'Ganzes':mode==='rectangle'?'Breite b':'Zweite Zahl'}<input data-lab="b" type="range" min="${mode==='function'?-3:1}" max="${mode==='part'?200:mode==='function'?3:10}" value="${mode==='part'?100:3}"></label></div><div id="lab-output" aria-live="polite"></div></section>`;}
function updateLab(){const lab=document.querySelector('[data-lab-mode]');if(!lab)return;const a=Number(lab.querySelector('[data-lab="a"]').value),b=Number(lab.querySelector('[data-lab="b"]').value),mode=lab.dataset.labMode,id=lab.dataset.labTopic;let html='';if(mode==='function')html=`<div class="lab-equation">${id==='parabola'?`f(x) = (x − (${a}))² + (${b})`:`f(x) = ${a}x + (${b})`}</div>${renderTaskVisual(id==='parabola'?{kind:'parabola',a:1,d:a,e:b}:{kind:'line',m:a,b})}<p>${id==='parabola'?`Scheitel: S(${a}, ${b})`:`Bei x = 2: f(2) = ${a*2+b}`}</p>`;else if(mode==='part')html=`<div class="lab-equation">${a} % von ${b} = <mark>${format(a*b/100)}</mark></div><div class="lab-fill"><i style="width:${a}%"></i></div><p>Das Ganze bleibt ${b}. Du wählst ${a} von 100 gleich großen Anteilen.</p>`;else if(mode==='rectangle')html=`${renderTaskVisual({kind:'rectangle',a,b})}<div class="lab-equation">A = ${a*b} m² · U = ${2*(a+b)} m</div>`;else html=`<div class="lab-equation">${a} ${id==='multiply'?'·':id==='numberLine'?'↔':'+'} ${b} ${id==='numberLine'?'Abstand':'='} <mark>${id==='multiply'?a*b:id==='numberLine'?Math.abs(a-b):a+b}</mark></div><div class="lab-dots">${Array.from({length:id==='multiply'?a*b:id==='numberLine'?Math.abs(a-b):a+b},(_,i)=>`<i style="background:${i<a?'#8b7cde':'#61ac9a'}"></i>`).join('')}</div>`;lab.querySelector('#lab-output').innerHTML=html;}
function beginLearning(stage=unlockedStage(lessonId)){const p=learningRecord();if(!p.read||stage>unlockedStage(lessonId))return;course={stage,task:null,gaps:[],answers:{},checks:null,solved:false,revealed:false,hint:false,first:true};newLearningTask();}
function newLearningTask(){const prev=course.task?.signature;let task;for(let i=0;i<12;i++){task=workedTask(grade,currentTopic(),{easy:course.stage===0});if(task.signature!==prev)break;}course={...course,task,gaps:gapIndices(task,learningStages[course.stage].id),answers:{},checks:null,solved:false,revealed:false,hint:false,first:true};view='learning';renderLearning();focusMain();}
function renderLearning(){const t=currentTopic(),p=learningRecord(),target=stageTarget(),s=learningStages[course.stage],task=course.task;const done=p.passed[course.stage]>=target;const allDone=completedStages(lessonId)===4;shell(`<div class="lesson-breadcrumb"><button class="text-btn" data-learning-action="explanation">← Zur Erklärung</button><span>${escape(t.title)} · Klasse ${grade}</span></div><div class="training-stage-nav">${learningStages.map((st,i)=>`<button data-stage="${i}" class="${i===course.stage?'current':''} ${p.passed[i]>=target?'finished':''}" ${i>unlockedStage(lessonId)?'disabled':''}><span>${p.passed[i]>=target?'✓':i+1}</span>${st.short}</button>`).join('')}</div><div class="training-heading"><div><span class="eyebrow">STUFE ${course.stage+1} VON 4</span><h1>${s.title}</h1><p>${s.description}</p></div><div class="stage-counter"><b>${Math.min(p.passed[course.stage],target)}</b> / ${target}<small>geschafft</small></div></div><section class="learning-task"><div class="task-topline"><span>${course.stage===3?'DEIN EIGENER RECHENWEG':'SCHRITT FÜR SCHRITT'}</span><button class="text-btn" data-learning-action="hint">${course.hint?'Hinweise ausblenden':'Ich brauche einen Hinweis'}</button></div><h2>${escape(task.prompt)}</h2>${renderTaskVisual(task.visual)}${course.stage===3?'<p class="solo-note">Rechne auf Papier oder im Notizfeld. Gib alle gefragten Teilergebnisse selbst ein. Es werden keine Rechnungen vorgegeben.</p><label class="scratch-label">Deine Notizen (freiwillig, werden nicht automatisch bewertet)<textarea id="scratchpad" rows="3" placeholder="Hier ist Platz für deinen eigenen Rechenweg …"></textarea></label>':''}<form id="learning-form" novalidate><ol class="training-steps">${task.steps.map((step,i)=>{const gap=course.gaps.includes(i),index=course.gaps.indexOf(i),check=course.checks?.[index];return `<li class="${gap?'has-gap':'given'} ${gap&&check===true?'step-correct':''} ${gap&&check===false?'step-wrong':''}"><span class="step-number">${i+1}</span><div><label for="step-${i}">${escape(step.label)}${!gap?'<small>Vorgegeben</small>':''}</label><div class="step-equation">${course.stage===3?'':escape(step.before)}${gap?`<input id="step-${i}" name="step-${i}" autocomplete="off" aria-label="${escape(step.label)}" ${check===false?'aria-invalid="true"':''} ${course.solved||course.revealed?'disabled':''} value="${escape(course.answers[i]??'')}" placeholder="${course.stage===3?'Dein Ergebnis':'?'}">`:`<mark>${escape(format(step.value))}</mark>`}${escape(step.after)}</div>${gap&&check===false?'<span class="field-error">Hier stimmt noch etwas nicht. Versuche diesen Schritt noch einmal.</span>':''}${course.hint?`<p class="step-hint">${escape(step.why)}</p>`:''}</div>${gap&&check===true?'<b class="inline-check" aria-label="Richtig">✓</b>':''}</li>`;}).join('')}</ol><p id="learning-error" role="alert"></p>${course.solved?`<div class="learning-success" role="status"><strong>✓ Genau! Du hast alle Lücken richtig gelöst.</strong><p>${done?allDone?'Alle vier Stufen geschafft. Du kannst jetzt selbstständig weiterüben.':'Diese Stufe ist geschafft. Die nächste ist jetzt offen.':'Dein nächster kleiner Schritt wartet schon.'}</p></div><div class="training-actions"><button type="button" class="btn primary" data-learning-action="${done&&!allDone?'advance':'next-task'}">${done&&!allDone?'Zur nächsten Stufe':'Noch eine Aufgabe'} →</button>${allDone?'<button type="button" class="btn outline" data-nav="topics">Nächsten Kurs entdecken →</button>':''}</div>`:course.revealed?`<div class="revealed-solution"><h3>Schauen wir gemeinsam auf den Weg.</h3>${workedStepsHTML(task)}<p>Diese aufgedeckte Aufgabe zählt nicht als geschafft. Versuche es jetzt mit einer neuen.</p><button type="button" class="btn primary" data-learning-action="next-task">Neue Aufgabe versuchen →</button></div>`:`<div class="training-actions"><button type="submit" class="btn primary">Meine Schritte prüfen ✓</button><button type="button" class="text-btn" data-learning-action="reveal">Rechenweg ansehen</button></div>`}</form></section><p class="exercise-note">Komma und Punkt sind erlaubt. Brüche zum Beispiel als 3/4; gleichwertige Brüche werden akzeptiert. Keine Tausendertrennzeichen verwenden.</p>`);if(course.solved)document.querySelector('[data-learning-action="advance"],[data-learning-action="next-task"]')?.focus();}
function captureLearning(){const form=document.querySelector('#learning-form');if(form)for(const i of course.gaps)course.answers[i]=form.elements[`step-${i}`].value.trim();const notes=document.querySelector('#scratchpad')?.value;if(notes!==undefined)course.notes=notes;}
function restoreNotes(){if(course?.notes&&document.querySelector('#scratchpad'))document.querySelector('#scratchpad').value=course.notes;}
function submitLearning(){if(course.solved||course.revealed)return;captureLearning();if(course.gaps.some(i=>!course.answers[i])){document.querySelector('#learning-error').textContent='Bitte fülle alle Lücken aus. Die Hinweise helfen dir beim nächsten Schritt.';return;}course.checks=checkLearning(course.task,course.gaps,course.answers);const p=learningRecord();if(course.first){p.attempts++;course.first=false;}course.solved=course.checks.every(Boolean);if(course.solved){p.correct++;p.passed[course.stage]=Math.min(stageTarget(),p.passed[course.stage]+1);if(!data.days.includes(day()))data.days.push(day());}putLearning(p);renderLearning();restoreNotes();if(!course.solved){const error=document.querySelector('.step-wrong input');error?.focus();}}
function handleLearningClick(b){if(b.dataset.example!==undefined){exampleIndex=Number(b.dataset.example);renderLesson();updateLab();document.querySelector(`[data-example="${exampleIndex}"]`)?.focus();return true;}if(b.dataset.stage!==undefined){if(course&&view==='learning')captureLearning();beginLearning(Number(b.dataset.stage));return true;}const action=b.dataset.learningAction;if(!action)return false;switch(action){case 'explanation':view='lesson';renderLesson();updateLab();focusMain();break;case 'begin':{const p=learningRecord();p.read=true;putLearning(p);beginLearning();break;}case 'advance':beginLearning(Math.min(3,course.stage+1));break;case 'next-task':course.notes='';newLearningTask();break;case 'hint':captureLearning();course.hint=!course.hint;renderLearning();restoreNotes();break;case 'reveal':captureLearning();course.revealed=true;renderLearning();restoreNotes();break;}return true;}
function courseProgressPanel(){const ts=curriculum[grade];return `<section class="panel course-progress-panel"><span class="eyebrow">DEIN NEUER LERNWEG · KLASSE ${grade}</span><h2>So wächst dein Können.</h2><p>Ein gefüllter Abschnitt bedeutet: Du hast die Aufgaben dieser Stufe selbst richtig ergänzt.</p><div class="progress-list">${ts.map(t=>`<button class="progress-row" data-topic="${t.id}"><div><strong>${escape(t.title)}</strong><span>${completedStages(t.id)} von 4 Stufen geschafft</span></div><div class="mini-stages">${learningRecord(t.id).passed.map((n,i)=>`<i class="${n>=stageTarget(t.id)?'done':''}" aria-label="${learningStages[i].short}: ${n>=stageTarget(t.id)?'geschafft':'noch offen'}"></i>`).join('')}</div><span>→</span></button>`).join('')}</div></section>`;}
home();

})();</script>
